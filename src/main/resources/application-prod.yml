# Perfil de PRODUCCIÓN.
# Sin valores por defecto a propósito: si falta una variable de entorno,
# la aplicación FALLA AL ARRANCAR (fail-fast) en lugar de arrancar insegura.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

springdoc:
  # Swagger/OpenAPI deshabilitados en producción: no exponer la documentación
  # ni la consola interactiva de la API al exterior.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # OBLIGATORIO en producción. Sin fallback: arranque falla si no está definido.
    # Generar con: openssl rand -base64 64
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-hours: ${JWT_REFRESH_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  app-base-url: ${APP_BASE_URL}
  api-base-url: ${API_BASE_URL}
  upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    # Cookies con Secure=true: solo se envían por HTTPS.
    cookies-secure: ${COOKIES_SECURE:true}
    signed-url-ttl-seconds: ${SIGNED_URL_TTL:3600}
    session-absolute-ttl-hours: ${SESSION_ABSOLUTE_TTL_HOURS:24}
  rate-limiting:
    auth-max-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  payments:
    epayco-public-key: ${EPAYCO_PUBLIC_KEY:}
    epayco-private-key: ${EPAYCO_PRIVATE_KEY:}
    epayco-customer-id: ${EPAYCO_CUSTOMER_ID:}
    epayco-p-key: ${EPAYCO_P_KEY:}
