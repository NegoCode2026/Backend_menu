spring:
  application:
    name: menu-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/menu_saas}
    username: ${DB_USER:menu_saas}
    password: ${DB_PASSWORD:menu_saas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Perfil de desarrollo: además de db/migration incluye db/dev (seed demo).
    # En producción (application-prod.yml) SOLO se ejecuta db/migration.
    locations: classpath:db/migration,classpath:db/dev
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # OBLIGATORIO en todos los ambientes (los tests lo inyectan dinámicamente).
    # NO usar un valor hardcodeado: generarlo con: openssl rand -base64 64
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-hours: ${JWT_REFRESH_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}
  app-base-url: ${APP_BASE_URL:http://localhost:4200}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    cookies-secure: ${COOKIES_SECURE:false}
    cookie-same-site: ${COOKIE_SAMESITE:Strict}
    signed-url-ttl-seconds: ${SIGNED_URL_TTL:3600}
    session-absolute-ttl-hours: ${SESSION_ABSOLUTE_TTL_HOURS:24}
  rate-limiting:
    # Máximo de peticiones por minuto a /api/auth/login, register y refresh (por IP).
    auth-max-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  payments:
    # Pasarela de pagos: ePayco Smart Checkout v2.
    # Si no se configuran las claves, el sistema opera en modo manual (solo dev/pruebas).
    epayco-public-key: ${EPAYCO_PUBLIC_KEY:}
    epayco-private-key: ${EPAYCO_PRIVATE_KEY:}
    epayco-customer-id: ${EPAYCO_CUSTOMER_ID:}
    epayco-p-key: ${EPAYCO_P_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.menusaas: INFO