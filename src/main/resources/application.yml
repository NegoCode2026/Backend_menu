spring:
  data:
    web:
      pageable:
        serialization-mode: VIA_DTO
        # Tope global de page/size en todos los listados (anti-DoS).
        max-page-size: 100
  application:
    name: menu-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/menu_saas}
    username: ${DB_USER:menu_saas}
    password: ${DB_PASSWORD:menu_saas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Agrupa en lotes las cargas de colecciones LAZY. Sin esto, mapear N
        # pedidos a su DTO emitía un SELECT por pedido (y uno por categoría en el
        # menú público). Con el valor en 100, N pedidos cuestan ceil(N/100)+1.
        # No se usa join fetch a propósito: combinado con paginación, Hibernate
        # trae la colección entera a memoria en lugar de traer solo la página.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    # Flyway toma su advisory lock dentro de una transacción por defecto. Con un
    # lock transaccional abierto, un CREATE INDEX CONCURRENTLY de una migración
    # posterior espera (virtualxid) a que esa transacción termine: es el propio
    # Flyway el que se bloquea, y el arranque se queda colgado para siempre.
    # Con lock de sesión no hay transacción abierta y CONCURRENTLY puede seguir.
    postgresql:
      transactional:
        lock: ${FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK:false}
    # Perfil de desarrollo: además de db/migration incluye db/dev (seed demo).
    locations: "classpath:db/migration,classpath:db/dev"
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # OBLIGATORIO en todos los ambientes (los tests lo inyectan dinámicamente).
    # NO usar un valor hardcodeado: generarlo con: openssl rand -base64 64
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-hours: ${JWT_REFRESH_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}
  app-base-url: ${APP_BASE_URL:http://localhost:4200}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    cookies-secure: ${COOKIES_SECURE:false}
    cookie-same-site: ${COOKIE_SAMESITE:Strict}
    signed-url-ttl-seconds: ${SIGNED_URL_TTL:3600}
    session-absolute-ttl-hours: ${SESSION_ABSOLUTE_TTL_HOURS:24}
  rate-limiting:
    # Máximo de peticiones por minuto a /api/auth/login, register y refresh (por IP).
    auth-max-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    # Máximo de peticiones por minuto al crear pedidos públicos (por IP).
    public-orders-max-per-minute: ${PUBLIC_ORDERS_RATE_LIMIT_PER_MINUTE:10}
    # Tope de claves vivas del limitador en memoria. Al alcanzarlo se purgan las
    # ventanas caducadas; si no basta, se rechaza tráfico nuevo en vez de crecer
    # sin límite (un atacante que varía la IP generaba una clave por intento).
    max-keys: ${RATE_LIMIT_MAX_KEYS:20000}
  whatsapp:
    # Aviso "tu pedido está listo" al cliente. Apagado por defecto.
    # Ninguna de estas variables estaba documentada antes: se podía activar el
    # interruptor sin credenciales y la llamada fallaba en silencio, con el
    # personal creyendo que los clientes sí recibían el aviso.
    # WhatsAppConfigValidator avisa al arrancar si se activa sin configurar bien.
    #
    # provider=meta (recomendado): requiere PHONE_NUMBER_ID y ACCESS_TOKEN de
    #   Meta → WhatsApp → API de WhatsApp (Business Portfolio, nivel 1+).
    # provider=webhook: delega en un servicio propio; requiere WHATSAPP_API_URL.
    enabled: ${WHATSAPP_ENABLED:false}
    provider: ${WHATSAPP_PROVIDER:meta}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:57}
    #
    # Las notificaciones se envían DENTRO de la transacción que actualiza el
    # pedido. Sin timeout, un proveedor colgado retiene conexión del pool y la
    # transacción indefinidamente: el pool se agota y cae toda la app.
    connect-timeout: ${WHATSAPP_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${WHATSAPP_READ_TIMEOUT:PT5S}
  flyway:
    # repair() realinea checksums y borra entradas fallidas. Apagado por
    # defecto: encender SOLO durante el deploy que lo necesita
    # (FLYWAY_REPAIR_ON_START=true) y apagar en el siguiente.
    repair-on-start: ${FLYWAY_REPAIR_ON_START:false}
  payments:
    # Pasarela de pagos: ePayco Smart Checkout v2.
    # Si no se configuran las claves, el sistema opera en modo manual (solo dev/pruebas).
    epayco-public-key: ${EPAYCO_PUBLIC_KEY:}
    epayco-private-key: ${EPAYCO_PRIVATE_KEY:}
    epayco-customer-id: ${EPAYCO_CUSTOMER_ID:}
    epayco-p-key: ${EPAYCO_P_KEY:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    url: ${CLOUDINARY_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.menusaas: INFO