name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers (BaseIntegrationTest, *IT) necesita Docker; el runner lo trae.
      - name: Verify (tests + ArchUnit + tenancy + JaCoCo)
        run: mvn -B verify
