services:
  db:
    image: postgres:16-alpine
    container_name: menu-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-menu_saas}
      POSTGRES_USER: ${DB_USER:-menu_saas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-menu_saas}
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432.
      # La app dentro de la red Docker usa db:5432 (ver DB_URL abajo).
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-menu_saas} -d ${DB_NAME:-menu_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  pgdata:
